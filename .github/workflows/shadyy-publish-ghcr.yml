name: Publish Shadyy Mautic image

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Image tag to publish
        required: true
        default: shadyy-v0.1.1
      push_latest:
        description: Also publish latest
        type: boolean
        required: true
        default: true
      source_ref:
        description: Source branch, tag, or SHA to build
        required: true
        default: custom/shadyy
      platforms:
        description: Docker platforms to build
        required: true
        default: linux/amd64

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/mautic

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_ref }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build tag list
        id: tags
        shell: bash
        run: |
          TAGS="${IMAGE_NAME}:${{ inputs.image_tag }}"
          if [ "${{ inputs.push_latest }}" = "true" ]; then
            TAGS="${TAGS},${IMAGE_NAME}:latest"
          fi
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.shadyy
          platforms: ${{ inputs.platforms }}
          build-args: |
            BASE_TAG=8.3-apache-bookworm
            FLAVOUR=apache
          push: true
          sbom: true
          provenance: true
          tags: ${{ steps.tags.outputs.tags }}
